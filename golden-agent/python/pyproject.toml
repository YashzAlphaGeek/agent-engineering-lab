[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-agent"
version = "1.0.0"
description = "A small framework-free library for building agents from the core elements."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["agent", "llm", "tool-use", "multi-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golden_agent = ["py.typed"]
